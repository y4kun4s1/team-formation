# Supabase 무료 프로젝트는 한동안 쓰지 않으면 멈춘다. 하루 한 번 가벼운 질의를 보내 멈추지 않게 한다.
# 필요한 설정: GitHub 저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL (Session pooler 주소)
name: keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: DB에 가벼운 질의 보내기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret이 없음"; exit 1; fi
          psql "$DATABASE_URL" -c "select count(*) from tf_settings" > /dev/null
          echo "DB 응답 확인함"
